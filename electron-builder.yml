appId: com.cls.logger
productName: CLS Logger
directories:
  output: dist
  buildResources: build
win:
  target:
    - target: dir
      arch: [x64]
  icon: icon.ico
extraResources:
  - from: "config"
    to: "config"
    filter:
      - "**/*"
files:
  - main/**/*
  - renderer/**/*
  - build/**/*
  - node_modules/**/*
  - package.json
asar: true
compression: maximum